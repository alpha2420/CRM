name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Style, static analysis, security and tests (SQLite)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mbstring, bcmath, gd, zip, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Code style
        run: vendor/bin/pint --test
      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Known vulnerabilities in dependencies
        run: composer audit
      - name: Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  mysql:
    name: Tests (MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: crm_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          extensions: pdo_mysql, mbstring, bcmath, gd, zip, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: crm_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          cp .env.example .env
          php artisan key:generate
          php vendor/bin/phpunit
