# /etc/nginx/sites-available/crm — for manual installs (deploy/install.sh writes
# the same). Replace crm.example.com, the path and the PHP version, then run
#   sudo certbot --nginx -d crm.example.com --redirect
# which adds the HTTPS lines and the http → https redirect.
server {
    listen 80;
    server_name crm.example.com;
    root /var/www/crm/public;   # never the project root
    index index.php;
    charset utf-8;
    client_max_body_size 12M;   # CSV imports

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(css|js|png|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # .env, .git and other dotfiles are never served.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
