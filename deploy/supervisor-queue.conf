; /etc/supervisor/conf.d/crm-queue.conf — keeps two queue workers running
; (WhatsApp sends, Facebook lead fetches, push notifications).
; With this in place, set CRM_SCHEDULER_RUNS_QUEUE=false in .env.
[program:crm-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/crm/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/crm
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/crm/storage/logs/queue.log
